# AGE 模板 CI 门禁示例
#
# 本模板支持多技术栈。请根据项目实际技术栈取消对应部分的注释，
# 并删除不适用的部分。复制到 .github/workflows/ci.yml 后启用。

name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  # ═══════════════════════════════════════════════════════════
  # 文档一致性检查（所有技术栈通用，建议保留）
  # ═══════════════════════════════════════════════════════════
  docs:
    name: Docs Validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check AGENTS.md exists
        run: |
          if [ ! -f "AGENTS.md" ]; then
            echo "AGENTS.md is missing!"
            exit 1
          fi

      - name: Check docs/index.md exists
        run: |
          if [ ! -f "docs/index.md" ]; then
            echo "docs/index.md is missing!"
            exit 1
          fi

      - name: Verify no unresolved placeholders in core docs
        run: |
          echo "Checking for unresolved {{...}} placeholders in core docs..."
          if grep -rn '{{' docs/context/ docs/architecture/ AGENTS.md README.md 2>/dev/null; then
            echo "Found unresolved placeholders! Run init script first."
            exit 1
          fi
          echo "All placeholders resolved - good!"

  # ═══════════════════════════════════════════════════════════
  # 安全扫描（所有技术栈通用，建议保留）
  # ═══════════════════════════════════════════════════════════
  security:
    name: Security Scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'fs'
          scan-ref: '.'
          format: 'sarif'
          output: 'trivy-results.sarif'
          exit-code: '0'
          severity: 'CRITICAL,HIGH'

      - name: Upload Trivy scan results
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: 'trivy-results.sarif'

